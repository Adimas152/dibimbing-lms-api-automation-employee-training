name: API Automation CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  api-test:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # 1. Checkout source code
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # 2. Setup Java
      # =========================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # =========================
      # 3. Grant gradlew permission
      # =========================
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # =========================
      # 4. Run API Automation Test
      # =========================
      - name: Run API Automation Tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          COMPANY_ID: ${{ secrets.COMPANY_ID }}
          IS_DEBUG: ${{ secrets.IS_DEBUG }}
        run: |
          ./gradlew clean test || true

      # =========================
      # 5. Extract Test Summary
      # =========================
      - name: Extract Test Summary
        if: always()
        run: |
          echo "📊 Extracting test result..."

          if [ -d build/test-results/test ]; then
            TOTAL=$(grep -R "<testcase" build/test-results/test | wc -l)
            FAILED=$(grep -R "<failure" build/test-results/test | wc -l)
            SKIPPED=$(grep -R "<skipped" build/test-results/test | wc -l)
          else
            TOTAL=0
            FAILED=0
            SKIPPED=0
          fi

          PASSED=$((TOTAL - FAILED - SKIPPED))

          if [ "$TOTAL" -eq 0 ]; then
            PASS_RATE=0
          else
            PASS_RATE=$((PASSED * 100 / TOTAL))
          fi

          echo "TOTAL=$TOTAL" >> $GITHUB_ENV
          echo "PASSED=$PASSED" >> $GITHUB_ENV
          echo "FAILED=$FAILED" >> $GITHUB_ENV
          echo "SKIPPED=$SKIPPED" >> $GITHUB_ENV
          echo "PASS_RATE=$PASS_RATE" >> $GITHUB_ENV

          echo "✔ TOTAL   : $TOTAL"
          echo "✔ PASSED  : $PASSED"
          echo "✔ FAILED  : $FAILED"
          echo "✔ SKIPPED : $SKIPPED"
          echo "✔ RATE    : $PASS_RATE%"

      # =========================
      # 6. Send Slack Notification
      # =========================
      - name: Send Slack Notification
        if: always()
        run: |
          if [ "$FAILED" -eq 0 ]; then
            STATUS="✅ PASSED"
            COLOR="good"
          else
            STATUS="❌ FAILED"
            COLOR="danger"
          fi

          curl -X POST -H 'Content-type: application/json' \
          --data "{
            \"attachments\": [
              {
                \"color\": \"$COLOR\",
                \"title\": \"API Automation Result\",
                \"fields\": [
                  {\"title\": \"Status\", \"value\": \"$STATUS\", \"short\": true},
                  {\"title\": \"Total Tests\", \"value\": \"$TOTAL\", \"short\": true},
                  {\"title\": \"Passed\", \"value\": \"$PASSED\", \"short\": true},
                  {\"title\": \"Failed\", \"value\": \"$FAILED\", \"short\": true},
                  {\"title\": \"Skipped\", \"value\": \"$SKIPPED\", \"short\": true},
                  {\"title\": \"Pass Rate\", \"value\": \"$PASS_RATE%\", \"short\": true},
                  {\"title\": \"Branch\", \"value\": \"${{ github.ref_name }}\", \"short\": true},
                  {\"title\": \"Triggered By\", \"value\": \"${{ github.actor }}\", \"short\": true}
                ],
                \"footer\": \"GitHub Actions\",
                \"ts\": $(date +%s)
              }
            ]
          }" \
          ${{ secrets.SLACK_WEBHOOK_URL }}
