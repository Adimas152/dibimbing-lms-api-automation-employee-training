name: API Automation CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  api-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run API Automation Tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          COMPANY_ID: ${{ secrets.COMPANY_ID }}
          IS_DEBUG: ${{ secrets.IS_DEBUG }}
        run: |
          ./gradlew clean test || true

      - name: Send Slack Notification
        if: always()
        run: |
          echo "📊 Collecting test results..."

          TOTAL=$(grep -R "<testcase" build/test-results/test | wc -l || echo 0)
          FAILED=$(grep -R "<failure" build/test-results/test | wc -l || echo 0)
          SKIPPED=$(grep -R "<skipped" build/test-results/test | wc -l || echo 0)
          PASSED=$((TOTAL - FAILED - SKIPPED))

          if [ "$TOTAL" -eq 0 ]; then
            PASS_PERCENT=0
          else
            PASS_PERCENT=$((PASSED * 100 / TOTAL))
          fi

          if [ "$FAILED" -eq 0 ]; then
            STATUS="✅ PASSED"
            COLOR="good"
          else
            STATUS="❌ FAILED"
            COLOR="danger"
          fi

          curl -X POST -H 'Content-type: application/json' \
          --data "{
            \"attachments\": [
              {
                \"color\": \"$COLOR\",
                \"title\": \"API Automation Result\",
                \"fields\": [
                  {\"title\": \"Status\", \"value\": \"$STATUS\", \"short\": true},
                  {\"title\": \"Total Tests\", \"value\": \"$TOTAL\", \"short\": true},
                  {\"title\": \"Passed\", \"value\": \"$PASSED\", \"short\": true},
                  {\"title\": \"Failed\", \"value\": \"$FAILED\", \"short\": true},
                  {\"title\": \"Skipped\", \"value\": \"$SKIPPED\", \"short\": true},
                  {\"title\": \"Pass Rate\", \"value\": \"$PASS_PERCENT%\", \"short\": true},
                  {\"title\": \"Branch\", \"value\": \"${{ github.ref_name }}\", \"short\": true},
                  {\"title\": \"Triggered By\", \"value\": \"${{ github.actor }}\", \"short\": true}
                ],
                \"footer\": \"GitHub Actions\",
                \"ts\": $(date +%s)
              }
            ]
          }" \
          ${{ secrets.SLACK_WEBHOOK_URL }}
      - name: Extract Test Summary
        run: |
          TOTAL=$(grep -R "<testcase" build/test-results/test | wc -l)
          FAILED=$(grep -R "<failure" build/test-results/test | wc -l)
          SKIPPED=$(grep -R "<skipped" build/test-results/test | wc -l)
          PASSED=$((TOTAL - FAILED - SKIPPED))
      
          echo "TOTAL=$TOTAL" >> $GITHUB_ENV
          echo "PASSED=$PASSED" >> $GITHUB_ENV
          echo "FAILED=$FAILED" >> $GITHUB_ENV
          echo "SKIPPED=$SKIPPED" >> $GITHUB_ENV


          
          
      
